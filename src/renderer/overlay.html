<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inputrix Miniatura</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-ui class="hud-body">
  <header class="hud-bar">
    <div class="hud-brand">
      <img src="../../assets/icon.png" alt="Logo Inputrix" width="14" height="14" class="brand-logo" />
      <span class="hud-title">Inputrix</span>
      <span class="hud-uptime mono" id="hudUptime">00:00:00</span>
    </div>
    <div class="hud-controls">
      <input type="range" id="rngHudOpacity" min="0.25" max="1" step="0.05" value="0.95" class="hud-slider" title="Ajustar opacidade da miniatura" aria-label="Ajustar opacidade da miniatura" />
      <button class="hud-close" id="btnCloseHud" title="Ocultar miniatura" aria-label="Ocultar miniatura">
        <svg width="9" height="9" viewBox="0 0 10 10" fill="none"><path d="M2 2L8 8M8 2L2 8" stroke="currentColor" stroke-width="1.4" /></svg>
      </button>
    </div>
  </header>

  <main class="hud-content" id="hudList">
    <div class="hud-empty">Aguardando execução (F6 / F7)</div>
  </main>

  <script src="overlay.js"></script>
</body>
</html>
